<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241945"/>
      <stop offset="50%" stop-color="#181130"/>
      <stop offset="100%" stop-color="#0c0819"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#2b1103"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#f59e0b" stroke-width="8" opacity="0.6"/>

  <!-- Glowing Circular Rim -->
  <circle cx="256" cy="260" r="185" fill="#130e24" stroke="#38bdf8" stroke-width="6" opacity="0.8"/>
  <circle cx="256" cy="260" r="175" fill="#1b1433" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Speed Lines / Track Accents -->
  <path d="M120 180 L80 180 M100 220 L60 220 M110 260 L70 260" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M392 180 L432 180 M412 220 L452 220 M402 260 L442 260" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Coffee Cup Body -->
  <g transform="translate(0, 10)">
    <!-- Cup Handle -->
    <path d="M320 230 C375 230 375 315 320 315" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Cup Saucer -->
    <ellipse cx="256" cy="365" rx="135" ry="18" fill="#0d0918" stroke="url(#goldGrad)" stroke-width="8"/>

    <!-- Cup Main Body -->
    <path d="M175 210 L337 210 C332 300 310 350 256 350 C202 350 180 300 175 210 Z" fill="url(#coffeeGrad)" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Cup Rim & Crema -->
    <ellipse cx="256" cy="210" rx="81" ry="22" fill="#d97706" stroke="url(#goldGrad)" stroke-width="8"/>
    <ellipse cx="256" cy="210" rx="65" ry="15" fill="#fef08a" opacity="0.85"/>
    <ellipse cx="245" cy="210" rx="40" ry="8" fill="#b45309" opacity="0.9"/>

    <!-- Steam Waves -->
    <path d="M220 175 C210 145 235 125 225 95" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M256 165 C246 130 270 110 260 75" fill="none" stroke="#fef08a" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
    <path d="M292 175 C282 145 305 125 295 95" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

    <!-- Lightning Bolt Badge on Cup -->
    <path d="M258 245 L242 278 L256 278 L248 308 L272 268 L258 268 Z" fill="#fde047" stroke="#100d1c" stroke-width="3"/>
  </g>

  <!-- Star Embellishments -->
  <polygon points="256,25 264,43 284,43 268,55 274,74 256,62 238,74 244,55 228,43 248,43" fill="#fde047"/>
  <polygon points="135,115 140,127 153,127 143,135 147,147 135,139 123,147 127,135 117,127 130,127" fill="#38bdf8"/>
  <polygon points="377,115 382,127 395,127 385,135 389,147 377,139 365,147 369,135 359,127 372,127" fill="#38bdf8"/>
</svg>
